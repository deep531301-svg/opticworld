<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B89028" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <!-- Background Circle (Luxury Blue) -->
  <circle cx="50" cy="50" r="48" fill="url(#blue-grad)" stroke="url(#gold-grad)" stroke-width="2"/>
  
  <!-- Outer glowing rings -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(212, 175, 55, 0.2)" stroke-width="1" stroke-dasharray="4 2"/>
  
  <!-- Stylized Elegant Spectacles / Eye Outline -->
  <path d="M28,45 C32,35 44,35 44,45 C44,52 32,52 28,45 Z" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72,45 C68,35 56,35 56,45 C56,52 68,52 72,45 Z" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hinge / Bridge connecting the frames -->
  <path d="M44,45 C47,42 53,42 56,45" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small spark of light on one lens (reflection) -->
  <circle cx="64" cy="41" r="2" fill="#FFFFFF"/>
</svg>